<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>$title</title></head>
<body style="margin:0;background:#f3f5f7;color:#172638;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background:#f3f5f7;"><tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="800" cellpadding="0" cellspacing="0" style="width:100%;max-width:800px;border-collapse:collapse;"><tr><td>
      <p style="font-size:11px;font-weight:700;letter-spacing:2px;color:#5279c4;margin:0 0 18px;">$label</p>
      <h1 style="font-family:Georgia,'Times New Roman',serif;font-size:36px;font-weight:400;line-height:1.2;margin:0 0 14px;">$heading</h1>
      <p style="font-size:13px;line-height:1.8;color:#687787;margin:0 0 24px;">$description<br>Saved data: <strong>$as_of</strong></p>
      $body
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-top:28px;"><tr><td style="border-top:1px solid #dce3e9;padding-top:20px;font-size:11px;line-height:1.8;color:#687787;">
        <p style="margin:0 0 10px;font-weight:700;">About these numbers</p>
        $notes
        <p style="overflow-wrap:anywhere;">Snapshot: $snapshot_id<br>Trace: $trace_id</p>
        <p style="font-size:10px;letter-spacing:1px;">PERSONAL WORKFLOW AGENT · $label</p>
      </td></tr></table>
    </td></tr></table>
  </td></tr></table>
</body>
</html>
